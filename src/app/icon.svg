<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#258554"/>
      <stop offset="100%" stop-color="#145536"/>
    </linearGradient>
    <linearGradient id="s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#C4831F"/>
    </linearGradient>
    <clipPath id="c">
      <rect x="2" y="2" width="60" height="60" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#g)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" ry="15" fill="none" stroke="#79c79a" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Lori Mascot Silhouette -->
  <g clip-path="url(#c)">
    <!-- Ears -->
    <circle cx="18" cy="24" r="6" fill="#C98B52"/>
    <circle cx="18" cy="24" r="3" fill="#8A5530"/>
    <circle cx="46" cy="24" r="6" fill="#C98B52"/>
    <circle cx="46" cy="24" r="3" fill="#8A5530"/>

    <!-- Head -->
    <ellipse cx="32" cy="33" rx="19" ry="17" fill="#C98B52"/>
    <ellipse cx="32" cy="38" rx="15" ry="11" fill="#F6E4C6"/>

    <!-- Eye Patches (Kukang Mask) -->
    <ellipse cx="24.5" cy="33" rx="6.5" ry="8" fill="#6E4024" transform="rotate(-15 24.5 33)"/>
    <ellipse cx="39.5" cy="33" rx="6.5" ry="8" fill="#6E4024" transform="rotate(15 39.5 33)"/>

    <!-- Forehead stripe -->
    <path d="M30.5 18 Q32 16 33.5 18 L33 35 L31 35 Z" fill="#F6E4C6"/>

    <!-- Eyes -->
    <circle cx="25" cy="33.5" r="4.5" fill="#FFFFFF"/>
    <circle cx="39" cy="33.5" r="4.5" fill="#FFFFFF"/>
    <circle cx="25.5" cy="33.5" r="3" fill="#1B1F22"/>
    <circle cx="39.5" cy="33.5" r="3" fill="#1B1F22"/>
    <!-- Glint -->
    <circle cx="26.8" cy="32.2" r="1.1" fill="#FFFFFF"/>
    <circle cx="40.8" cy="32.2" r="1.1" fill="#FFFFFF"/>

    <!-- Nose & Smile -->
    <ellipse cx="32" cy="41" rx="2" ry="1.4" fill="#3A2416"/>
    <path d="M29 43.5 Q32 46.5 35 43.5" stroke="#3A2416" stroke-width="1.3" fill="none" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="20" cy="39" r="2.2" fill="#F08A7A" opacity="0.6"/>
    <circle cx="44" cy="39" r="2.2" fill="#F08A7A" opacity="0.6"/>

    <!-- Golden Orange Scarf -->
    <path d="M16 47 Q32 53 48 47 L49 54 Q32 60 15 54 Z" fill="url(#s)"/>
    <path d="M37 52 L43 62 L37 61 L34 53 Z" fill="#C4831F"/>
  </g>

  <!-- Learning Star Badge -->
  <circle cx="49" cy="15" r="8" fill="#F2A93B" stroke="#ffffff" stroke-width="1.8"/>
  <path d="M46.5 12.5 H51.5 M46.5 15 H50.5 M46.5 17.5 H51.5" stroke="#3A2416" stroke-width="1.4" stroke-linecap="round"/>
</svg>
